global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Most dashboard panels and every alert read these. Copied from observability/deploy/prometheus.
rule_files:
  - /etc/prometheus/rules.yml
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: scheme-saathi
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/secrets/metrics_token
    static_configs:
      - targets: ["scheme-saathi:8766"]

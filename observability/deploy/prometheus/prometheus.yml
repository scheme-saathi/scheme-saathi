# Prometheus for Scheme Saathi. See docs/observability.md.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules.yml
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: scheme-saathi
    metrics_path: /metrics
    # The token is read from a file so it is never written into this config. It must match
    # METRICS_BEARER_TOKEN in the app's .env (see docs/observability.md).
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/secrets/metrics_token
    static_configs:
      # The app on the host machine (streamlit run app/app_new.py starts the API on port 8766).
      # If the app runs in a container on this Compose network, use that container's name and port instead.
      - targets: ["host.docker.internal:8766"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

services:
  scheme-saathi:
    image: singhd4/scheme-saathi:sha-819791b72b002769938b1b4ad615813af2e6360c
    container_name: scheme-saathi
    restart: unless-stopped
    # Start the chat API (which serves /metrics on 8766) at boot. Otherwise it only starts when someone
    # opens the UI, so Prometheus sees the app as down. Streamlit finds this API and reuses it.
    command:
      - sh
      - -c
      - >-
        uvicorn app.api:create_api --factory --host 0.0.0.0 --port 8766 --log-level warning &
        exec streamlit run app/app_new.py --server.address=0.0.0.0 --server.port=8501 --browser.gatherUsageStats=false
    ports:
      - "127.0.0.1:8501:8501"
    environment:
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      SUPERVISOR_MODEL: ${SUPERVISOR_MODEL:?Set SUPERVISOR_MODEL in .env}
      SPECIALIST_MODEL: ${SPECIALIST_MODEL:?Set SPECIALIST_MODEL in .env}
      OBSERVABILITY_ENABLED: ${OBSERVABILITY_ENABLED:-true}
      METRICS_BEARER_TOKEN: ${METRICS_BEARER_TOKEN:?Set METRICS_BEARER_TOKEN in .env}
      SCHEME_SAATHI_CHAT_API_HOST: 0.0.0.0
      AUTH0_DOMAIN: ${AUTH0_DOMAIN:?Set AUTH0_DOMAIN in .env}
      AUTH0_CLIENT_ID: ${AUTH0_CLIENT_ID:?Set AUTH0_CLIENT_ID in .env}
      AUTH0_AUDIENCE: ${AUTH0_AUDIENCE:?Set AUTH0_AUDIENCE in .env}
      AUTH0_HOUSEHOLD_CLAIM: ${AUTH0_HOUSEHOLD_CLAIM:?Set AUTH0_HOUSEHOLD_CLAIM in .env}
      AUTH0_REDIRECT_URI: ${AUTH0_REDIRECT_URI:-http://localhost:8501}
      AUTH0_ROLE_CLAIM: ${AUTH0_ROLE_CLAIM:-}
      MOCK_PORTAL_AUTH_SECRET: ${MOCK_PORTAL_AUTH_SECRET:?Set MOCK_PORTAL_AUTH_SECRET in .env}
    volumes:
      - scheme-saathi-documents:/app/data/private_documents

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: scheme-saathi-prometheus
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules.yml:/etc/prometheus/rules.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ./prometheus/metrics_token:/etc/prometheus/secrets/metrics_token:ro
      - prometheus-data:/prometheus
    depends_on:
      - scheme-saathi

  grafana:
    image: singhd4/scheme-saathi-grafana:sha-819791b72b002769938b1b4ad615813af2e6360c
    container_name: scheme-saathi-grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  scheme-saathi-documents:
  prometheus-data:
  grafana-data:
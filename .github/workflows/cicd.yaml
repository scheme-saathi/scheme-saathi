name: Scheme Saathi CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: scheme-saathi-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  integration:
    name: Continuous integration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[dev,rag]"

      - name: Run unit tests
        run: python -m pytest -q

  build_image:
    name: Build Docker image
    needs: integration
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: scheme-saathi:${{ github.sha }}
          outputs: type=docker,dest=/tmp/scheme-saathi.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Upload Docker image
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'))
        uses: actions/upload-artifact@v4
        with:
          name: scheme-saathi-image
          path: /tmp/scheme-saathi.tar
          if-no-files-found: error

  build_grafana_image:
    name: Build Grafana image
    needs: integration
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Grafana image
        uses: docker/build-push-action@v6
        with:
          context: ./observability/deploy/grafana
          file: ./observability/deploy/grafana/Dockerfile
          push: false
          tags: scheme-saathi-grafana:${{ github.sha }}
          outputs: type=docker,dest=/tmp/scheme-saathi-grafana.tar
          cache-from: type=gha,scope=grafana
          cache-to: type=gha,scope=grafana,mode=max

      - name: Upload Grafana image
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'))
        uses: actions/upload-artifact@v4
        with:
          name: scheme-saathi-grafana-image
          path: /tmp/scheme-saathi-grafana.tar
          if-no-files-found: error

  push_to_registry:
    name: Push Docker image to Docker Hub
    needs: [build_image, build_grafana_image]
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'))
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Validate Docker Hub settings
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DOCKERHUB_REPOSITORY: ${{ vars.DOCKERHUB_REPOSITORY }}
        run: |
          set -euo pipefail
          missing=()
          for name in DOCKERHUB_USERNAME DOCKERHUB_TOKEN DOCKERHUB_REPOSITORY; do
            if [[ -z "${!name}" ]]; then
              missing+=("$name")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing GitHub production secrets or variables: %s\n' "${missing[*]}"
            exit 1
          fi
          if [[ ! "$DOCKERHUB_REPOSITORY" =~ ^[a-z0-9._-]+/[a-z0-9._-]+$ ]]; then
            echo "DOCKERHUB_REPOSITORY must use namespace/image format."
            exit 1
          fi

      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: scheme-saathi-image
          path: /tmp

      - name: Download Grafana image
        uses: actions/download-artifact@v4
        with:
          name: scheme-saathi-grafana-image
          path: /tmp

      - name: Load Docker image
        run: |
          docker load --input /tmp/scheme-saathi.tar
          docker load --input /tmp/scheme-saathi-grafana.tar

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag and push Docker image
        env:
          DOCKERHUB_REPOSITORY: ${{ vars.DOCKERHUB_REPOSITORY }}
        shell: bash
        run: |
          set -euo pipefail
          GRAFANA_REPOSITORY="${DOCKERHUB_REPOSITORY}-grafana"
          docker tag "scheme-saathi:${GITHUB_SHA}" "${DOCKERHUB_REPOSITORY}:${GITHUB_REF_NAME}"
          docker tag "scheme-saathi:${GITHUB_SHA}" "${DOCKERHUB_REPOSITORY}:sha-${GITHUB_SHA}"
          docker tag "scheme-saathi-grafana:${GITHUB_SHA}" "${GRAFANA_REPOSITORY}:${GITHUB_REF_NAME}"
          docker tag "scheme-saathi-grafana:${GITHUB_SHA}" "${GRAFANA_REPOSITORY}:sha-${GITHUB_SHA}"
          docker push "${DOCKERHUB_REPOSITORY}:${GITHUB_REF_NAME}"
          docker push "${DOCKERHUB_REPOSITORY}:sha-${GITHUB_SHA}"
          docker push "${GRAFANA_REPOSITORY}:${GITHUB_REF_NAME}"
          docker push "${GRAFANA_REPOSITORY}:sha-${GITHUB_SHA}"


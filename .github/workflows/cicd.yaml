name: Scheme Saathi AWS CI/CD

on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
  pull_request:
    branches: [main, develop]
    paths-ignore:
      - "README.md"
  workflow_dispatch:

concurrency:
  group: scheme-saathi-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  integration:
    name: Continuous integration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[dev,rag]"

      - name: Run unit tests
        run: python -m pytest -q

  push_to_registry:
    name: Build and push Docker image
    needs: integration
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate Docker Hub settings
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DOCKERHUB_REPOSITORY: ${{ vars.DOCKERHUB_REPOSITORY }}
          IMAGE_NAME: ${{ secrets.IMAGE_NAME }}    
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          SUPERVISOR_MODEL: ${{ vars.SUPERVISOR_MODEL }}
          SPECIALIST_MODEL: ${{ vars.SPECIALIST_MODEL }}
          MOCK_PORTAL_AUTH_SECRET: ${{ secrets.MOCK_PORTAL_AUTH_SECRET }}
          AUTH0_DOMAIN: ${{ vars.AUTH0_DOMAIN }}
          AUTH0_CLIENT_ID: ${{ vars.AUTH0_CLIENT_ID }}
          AUTH0_AUDIENCE: ${{ vars.AUTH0_AUDIENCE }}
          AUTH0_REDIRECT_URI: ${{ vars.AUTH0_REDIRECT_URI }}
          AUTH0_HOUSEHOLD_CLAIM: ${{ vars.AUTH0_HOUSEHOLD_CLAIM }}
        run: |
          set -euo pipefail
          missing=()
          for name in DOCKERHUB_USERNAME DOCKERHUB_TOKEN DOCKERHUB_REPOSITORY; do
            if [[ -z "${!name}" ]]; then
              missing+=("$name")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing GitHub production secrets or variables: %s\n' "${missing[*]}"
            exit 1
          fi
          if [[ ! "$DOCKERHUB_REPOSITORY" =~ ^[a-z0-9._-]+/[a-z0-9._-]+$ ]]; then
            echo "DOCKERHUB_REPOSITORY must use namespace/image format."
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ vars.DOCKERHUB_REPOSITORY }}:main
            ${{ vars.DOCKERHUB_REPOSITORY }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max


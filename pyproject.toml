[project]
name = "scheme-saathi"
version = "0.1.0"
description = "Welfare-scheme navigator for citizens and CSC operators"
requires-python = ">=3.11"
dependencies = [
    "fastmcp",
    "fastapi",
    "uvicorn",
    "pydantic",
    "httpx",
    "langgraph",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

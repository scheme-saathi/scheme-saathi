[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scheme-saathi"
version = "0.1.0"
description = "Welfare-scheme navigator for citizens and CSC operators"
requires-python = ">=3.11"
dependencies = [
    "pydantic",
    "langgraph",
    "langgraph-checkpoint-sqlite",
    "fastmcp",
    "fastapi",
    "streamlit>=1.57",
    "python-multipart>=0.0.20",
    "uvicorn>=0.30",
    "langchain-openai",
    "langsmith>=0.3.45,<1",    "python-dotenv",
    "python-barcode[images]>=0.15,<1",
    "python-docx>=1.1,<2",
    "reportlab>=4.2,<5",
    "PyJWT[crypto]>=2.8,<3",
    "prometheus-client>=0.20,<1",
]

[project.optional-dependencies]
dev = ["pytest"]
rag = ["openpyxl>=3.1,<4", "sentence-transformers>=3,<6", "chromadb>=1,<2", "pypdf>=6,<7", "pdfplumber>=0.11,<0.12"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.package-data]
observability = ["model_prices.json"]

[tool.setuptools.packages.find]
where = ["."]
include = [
    "app",
    "app.*",
    "servers",
    "servers.*",
    "agents",
    "agents.*",
    "graph",
    "graph.*",
    "evaluation",
    "evaluation.*",
    "observability",
    "observability.*",
]
namespaces = true
